<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Putzplan · Einrichtung (Prototyp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style>
/* Prototyp der Einrichtung für neue Haushalte. Farben und Formen wie putz-app/styles.css. */
:root {
  --bg: #0d1012; --surface: #181b1e; --surface-2: #212428; --line: #26292d;
  --text: #f0f2f4; --muted: #a0a5ab; --muted-2: #888d92; --off: #2b2e32;
  --accent: #7ae2c0; --on-accent: #081717; --accent-soft: #132c24;
  --partner: #c3aeec; --partner-soft: #2b2338; --overdue: #f19f94; --today: #f2cf6b;
  --info: #a9c3ec; --info-soft: #1d2a3b;
  --area-kueche: #eaaa7f; --area-bad: #7bc5ef; --area-wohnen: #8ecc9a; --area-pflanzen: #b8c27a; --area-robo: #c4adef;
  --swatch-1: #7ae2c0; --swatch-2: #c3aeec; --swatch-3: #f4b581; --swatch-4: #82c7f0;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 500 15px/1.4 'Figtree', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
.ms { font-family: 'Material Symbols Rounded'; font-size: 22px; line-height: 1; font-variation-settings: 'FILL' 1; display: inline-block; flex: none; user-select: none; }

/* Umschalter oben: welcher Weg wird gezeigt (nur im Prototyp) */
.proto { max-width: 420px; margin: 0 auto; padding: 12px 16px 0; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted-2); }
.proto .seg { flex: 1; }

.app { max-width: 420px; margin: 0 auto; min-height: calc(100dvh - 54px); padding: 14px 18px 32px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.back { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--muted); }
.back:active { background: var(--surface); }
.dots { flex: 1; display: flex; gap: 6px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--off); }
.dots i.on { background: var(--accent); }
.step-of { font-size: 12px; font-weight: 700; color: var(--muted-2); min-width: 32px; text-align: right; }

.hero { display: flex; flex-direction: column; gap: 10px; }
.hero .big-icon { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 6px; }
.hero .big-icon .ms { font-size: 34px; }
.hero.partner .big-icon { background: var(--partner-soft); color: var(--partner); }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.lead { color: var(--muted); font-size: 15px; line-height: 1.45; text-wrap: pretty; }

.card { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.rows { padding: 4px 16px; gap: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row b { font-size: 15px; font-weight: 700; }
.row small { font-size: 13px; color: var(--muted); line-height: 1.35; }
.tile { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: color-mix(in srgb, var(--ac, var(--accent)) 18%, transparent); color: var(--ac, var(--accent)); flex: none; }
.tile .ms { font-size: 22px; }

.field { width: 100%; height: 52px; border-radius: 26px; border: none; background: var(--surface-2); color: var(--text); padding: 0 20px; font-size: 16px; font-weight: 600; outline: none; }
.field:focus { box-shadow: 0 0 0 2px var(--accent) inset; }
label.lbl { font-size: 13px; font-weight: 700; color: var(--muted); padding-left: 6px; }
.person { display: flex; flex-direction: column; gap: 8px; }
.swatches { display: flex; gap: 10px; padding-left: 6px; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; }
.swatches button.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--text); }

.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--off); position: relative; flex: none; transition: background .2s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #d6d9dc; transition: transform .2s; }
.switch.on { background: var(--accent); }
.switch.on span { transform: translateX(20px); background: var(--on-accent); }
.stepper { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 22px; padding: 2px; flex: none; }
.stepper button { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; }
.stepper button:disabled { opacity: .35; }
.stepper b { min-width: 24px; text-align: center; font-size: 16px; font-weight: 800; }

.acc-head { width: 100%; text-align: left; }
.acc-head > .ms:last-child { color: var(--muted-2); transition: transform .2s; }
.acc.open .acc-head > .ms:last-child { transform: rotate(180deg); }
.acc + .acc { border-top: 1px solid var(--line); }
.acc-body { padding: 0 0 8px 54px; }
.trow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.trow .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.trow b { font-size: 14px; font-weight: 600; line-height: 1.25; }
.trow small { font-size: 12px; color: var(--muted); }
.trow.off .grow { opacity: .45; }
.switch.sm { width: 44px; height: 28px; }
.switch.sm span { width: 22px; height: 22px; }
.switch.sm.on span { transform: translateX(16px); }
.pot { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.pot-top { display: flex; justify-content: space-between; align-items: baseline; }
.pot-top span { font-size: 13px; font-weight: 800; color: var(--partner); }
.pot-top span.ok { color: var(--accent); }
.pips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 4px; }
.pips i { height: 6px; border-radius: 3px; background: var(--off); transition: background .25s; }
.pips i.on { background: var(--partner); }
.slot { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 8px 8px 12px; border-radius: 16px; border: 1.5px dashed var(--dash, #3a3e43); color: var(--muted-2); font-size: 14px; }
.slot.full { border: none; background: var(--partner-soft); color: var(--text); font-weight: 600; animation: fade .25s ease-out; }
.slot .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--muted); flex: none; }
.slot.full .num { background: var(--partner); color: #181322; }
.slot .txt { flex: 1; min-width: 0; line-height: 1.3; }
.slot .x { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; color: var(--muted); }
.slot .x .ms { font-size: 18px; }
.slot.write { border: 2px solid var(--partner); background: var(--surface-2); padding-right: 6px; }
.slot.write input { flex: 1; min-width: 0; height: 40px; border: none; background: transparent; color: var(--text); font-size: 16px; font-weight: 600; outline: none; }
.slot.write .num { background: var(--partner-soft); color: var(--partner); }
.round.sm { width: 40px; height: 40px; }
.more-card { display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 16px; border: 1.5px dashed var(--dash, #3a3e43); color: var(--partner); font-weight: 700; font-size: 14px; }
.round { width: 52px; height: 52px; border-radius: 50%; background: var(--partner); color: #181322; display: grid; place-items: center; flex: none; }
.round:disabled { opacity: .35; }
.ideas { display: flex; flex-wrap: wrap; gap: 8px; }
.ideas > span { width: 100%; font-size: 13px; font-weight: 700; color: var(--muted); padding-left: 4px; }
.chip { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 14px 0 10px; border-radius: 19px; background: var(--surface); font-size: 14px; font-weight: 600; }
.chip .ms { font-size: 18px; color: var(--partner); }
.fine { font-size: 12px; color: var(--muted-2); text-align: center; }
.sub { font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-2); padding: 0 6px; margin-bottom: -12px; }
.count { display: flex; align-items: baseline; gap: 8px; padding: 2px 4px; }
.count b { font-size: 26px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.count span { color: var(--muted); font-size: 14px; }

.choice { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: inset 0 0 0 1.5px transparent; text-align: left; }
.choice.on { box-shadow: inset 0 0 0 2px var(--accent); }
.choice .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted-2); flex: none; margin-top: 2px; display: grid; place-items: center; }
.choice.on .radio { border-color: var(--accent); }
.choice.on .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.choice .grow { display: flex; flex-direction: column; gap: 4px; }
.choice b { font-size: 16px; }
.choice small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.choice small b { font-size: inherit; color: var(--text); }
.tag { align-self: flex-start; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--on-accent); background: var(--accent); padding: 3px 8px; border-radius: 8px; }

.chart { display: flex; flex-direction: column; gap: 8px; }
.chart .bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 110px; }
.chart .bars i { border-radius: 4px 4px 2px 2px; background: var(--accent); min-height: 3px; position: relative; transition: height .35s; }
.chart .bars i.hot { background: var(--overdue); }
.chart .bars i em { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; font-weight: 800; color: var(--overdue); }
.chart .axis { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; font-size: 10px; color: var(--muted-2); text-align: center; }
.chart .cap { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 8px; }
.bullet { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); line-height: 1.45; }
.bullet .ms { color: var(--accent); font-size: 20px; margin-top: 1px; }
.bullet b { color: var(--text); }

.code-box { background: var(--surface-2); border-radius: 18px; padding: 14px 16px; font-size: 18px; font-weight: 800; letter-spacing: .06em; text-align: center; font-variant-numeric: tabular-nums; }
.btn2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; background: var(--info-soft); color: var(--info); font-size: 13px; line-height: 1.45; }
.note .ms { font-size: 20px; }

.pill { height: 46px; border-radius: 23px; padding: 0 18px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface-2); font-weight: 700; font-size: 15px; }
.pill .ms { font-size: 20px; }
.pill.primary { background: var(--accent); color: var(--on-accent); }
.pill.big { height: 56px; border-radius: 28px; font-size: 17px; }
.pill.ghost { background: transparent; color: var(--muted); }
.pill:disabled { opacity: .4; }
.spacer { flex: 1; }
.foot { display: flex; flex-direction: column; gap: 6px; }

/* Startseite nach der Einrichtung (vereinfacht) */
.banner { display: flex; gap: 14px; align-items: center; background: var(--surface); border-radius: 24px; padding: 14px 16px; box-shadow: inset 0 0 0 1.5px var(--accent); }
.banner .grow { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.banner small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.prog { height: 6px; border-radius: 3px; background: var(--off); overflow: hidden; margin-top: 6px; }
.prog span { display: block; height: 100%; background: var(--accent); }
.sec { display: flex; justify-content: space-between; align-items: baseline; }
.sec h3 { font-size: 20px; font-weight: 800; }
.sec span { font-size: 13px; color: var(--muted); }
.frow { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 22px; padding: 12px; }
.frow .grow { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.frow b { font-size: 15px; }
.frow small { font-size: 13px; color: var(--today); }
.pts { height: 44px; min-width: 58px; border-radius: 22px; background: var(--accent-soft); color: var(--accent); font-weight: 800; display: grid; place-items: center; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 24px; background: var(--surface); }
.seg button { height: 38px; border-radius: 19px; font-size: 13px; font-weight: 700; color: #d6d9dc; text-align: center; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.fade { animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<div class="proto"><span>Weg:</span><div class="seg" id="flow"></div></div>
<main class="app" id="app"></main>
<script>
// Katalog aus putz-app/js/tasks.js: [id, Bereich, Intervall, Punkte, Name, Zuordnung].
// Zuordnung: f:<Ausstattung>, bath2 = nur mit zweitem Bad, room:<Raum> = nur mit diesem Raum.
// Aufräumen/Staub/Fenster je Wohnraum werden unten aus Vorlagen erzeugt.
const CATALOG = [["k-arbeitsflaechen","kueche","W",10,"Arbeitsflächen gründlich reinigen (alles abräumen)",""],["k-herd","kueche","W",5,"Herd reinigen",""],["k-spuele","kueche","W",5,"Spüle und Wasserhahn reinigen",""],["k-fronten","kueche","W",5,"Fronten und Griffe abwischen",""],["k-mikrowelle","kueche","W",10,"Mikrowelle auswischen","f:mikro"],["k-kuehlschrank-check","kueche","W",10,"Kühlschrank: Abgelaufenes aussortieren",""],["k-restmuell","kueche","W",3,"Müll rausbringen: Restmüll",""],["k-biomuell","kueche","W",3,"Müll rausbringen: Biomüll",""],["k-plastik","kueche","W",3,"Müll rausbringen: Plastik (Gelber Sack)",""],["k-papier-glas","kueche","W",3,"Müll rausbringen: Papier",""],["k-glas","kueche","2W",5,"Müll rausbringen: Glas",""],["k-lappen","kueche","W",3,"Lappen und Geschirrtücher wechseln",""],["b-wc-1","bad","W",10,"Bad 1: WC putzen",""],["b-wc-2","bad","W",10,"Bad 2: WC putzen","bath2"],["b-dusche-1","bad","W",20,"Bad 1: Dusche bzw. Wanne reinigen",""],["b-waschbecken-1","bad","W",10,"Bad 1: Waschbecken und Armaturen",""],["b-waschbecken-2","bad","W",5,"Bad 2: Waschbecken und Armaturen","bath2"],["b-boden-1","bad","W",10,"Bad 1: Boden feucht wischen",""],["b-boden-2","bad","W",10,"Bad 2: Boden feucht wischen","bath2"],["b-spiegel-1","bad","W",5,"Bad 1: Spiegel putzen",""],["b-spiegel-2","bad","W",5,"Bad 2: Spiegel putzen","bath2"],["b-handtuecher","bad","W",3,"Handtücher und Badematten wechseln",""],["b-waesche-heiss","bad","W",10,"Wäsche heiß","f:waschma"],["w-teppich","wohnen","W",10,"Teppich im Wohnzimmer saugen",""],["w-ecken","wohnen","W",15,"Ecken und Kanten saugen",""],["w-bettwaesche","wohnen","2W",15,"Bettwäsche wechseln",""],["p-giessen","pflanzen","W",5,"Pflanzen gießen","f:pflanzen"],["r-starten","robo","W",5,"Boden freiräumen, Roboter starten","f:robo"],["r-behaelter","robo","W",10,"Staubbehälter, Tank und Pads reinigen","f:robo"],["k-backofen","kueche","M",30,"Backofen und Bleche reinigen",""],["k-kuehlschrank","kueche","M",20,"Kühlschrank auswischen",""],["k-muelleimer","kueche","M",20,"Mülleimer auswaschen",""],["k-spuelmaschine","kueche","M",15,"Spülmaschine: Sieb und Dichtungen","f:spuelma"],["k-schubfaecher","kueche","M",20,"Schubfächer aussaugen und auswischen",""],["k-entkalken","kueche","M",10,"Wasserkocher und Kaffeemaschine entkalken",""],["b-fugen","bad","M",15,"Fliesenfugen schrubben, Ränder",""],["b-abfluss-1","bad","M",20,"Bad 1: Dusche Abfluss reinigen",""],["b-stoepsel-1","bad","M",10,"Bad 1: Waschbecken-Stöpsel reinigen",""],["b-stoepsel-2","bad","M",10,"Bad 2: Waschbecken-Stöpsel reinigen","bath2"],["b-waschmaschine","bad","M",20,"Waschmaschine: Sieb, Gummi, Fach","f:waschma"],["b-duschkopf","bad","M",20,"Duschköpfe, Duschtür und Armaturen entkalken",""],["w-fussleisten","wohnen","M",10,"Fußleisten und Türen abwischen",""],["w-schraenke-oben","wohnen","M",10,"Staub auf Schränken und hohen Flächen",""],["w-sofa","wohnen","M",10,"Sofa und Polster absaugen",""],["w-klinken","wohnen","M",5,"Türklinken, Lichtschalter, Fernbedienungen",""],["w-glas","wohnen","M",10,"Spiegel und Glasflächen putzen",""],["w-fensterbretter","wohnen","M",15,"Fensterbretter abwischen",""],["w-technik","wohnen","M",5,"Arbeitszimmer: Technik entstauben","room:Arbeitszimmer"],["p-pflege","pflanzen","M",15,"Blätter abstauben, düngen (März–Sept.)","f:pflanzen"],["r-buersten","robo","M",5,"Bürsten von Haaren befreien","f:robo"],["r-filter","robo","M",5,"Filter, Sensoren, Ladekontakte","f:robo"],["k-abtauen","kueche","Q",50,"Kühlschrank und Gefrierfach abtauen",""],["k-schraenke-innen","kueche","Q",35,"Küchenschränke innen, Vorräte prüfen",""],["k-fettfilter","kueche","Q",15,"Dunstabzug: Fettfilter reinigen",""],["w-teppich-tief","wohnen","Q",50,"Teppich tiefenreinigen",""],["w-moebel","wohnen","Q",20,"Möbel abrücken, dahinter saugen",""],["w-fenster-kueche","wohnen","Q",20,"Fenster putzen: Küche",""],["w-matratzen","wohnen","Q",15,"Matratzen absaugen und wenden",""],["w-vorhaenge","wohnen","Q",20,"Vorhänge und Gardinen waschen",""],["w-kissen","wohnen","Q",20,"Kopfkissen und Bettdecken waschen",""],["w-lampen","wohnen","Q",10,"Lampen abstauben",""],["w-rauchmelder","wohnen","Q",3,"Rauchmelder testen",""],["p-schaedlinge","pflanzen","Q",60,"Schädlinge prüfen, umtopfen","f:pflanzen"],["r-verschleiss","robo","Q",10,"Verschleißteile tauschen, Station reinigen","f:robo"]];
const AREAS = {
  kueche: { name: 'Küche', icon: 'skillet' }, bad: { name: 'Bäder', icon: 'bathtub' },
  wohnen: { name: 'Wohnräume', icon: 'weekend' }, pflanzen: { name: 'Pflanzen', icon: 'potted_plant' },
  robo: { name: 'Roboter', icon: 'robot_2' },
};
const IV = { W: 'wöchentlich', '2W': 'alle 2 Wochen', M: 'monatlich', Q: 'quartalsweise' };
const FEATURES = [
  { id: 'robo', icon: 'robot_2', area: 'robo', name: 'Saugroboter', hint: 'Roboter starten, Behälter, Bürsten …', tasks: 5, on: true },
  { id: 'pflanzen', icon: 'potted_plant', area: 'pflanzen', name: 'Zimmerpflanzen', hint: 'Gießen, Pflege, Schädlinge', tasks: 3, on: true },
  { id: 'waschma', icon: 'local_laundry_service', area: 'bad', name: 'Eigene Waschmaschine', hint: 'Wäsche waschen, Sieb und Gummi', tasks: 3, on: true },
  { id: 'spuelma', icon: 'dishwasher_gen', area: 'kueche', name: 'Geschirrspüler', hint: 'Ausräumen, Sieb und Dichtungen', tasks: 2, on: true },
  { id: 'mikro', icon: 'microwave', area: 'kueche', name: 'Mikrowelle', hint: 'Auswischen', tasks: 1, on: true },
];
// Wohnräume als Anzahl, der Flur zählt mit. Namen in dieser Reihenfolge, später umbenennbar.
const ROOM_NAMES = ['Wohnzimmer', 'Schlafzimmer', 'Flur', 'Arbeitszimmer', 'Kinderzimmer', 'Gästezimmer', 'Zimmer 7', 'Zimmer 8'];
const PER_ROOM = 3; // Aufräumen, Staubwischen, Fenster bzw. Boden
const CATALOG_ROOMS = 4; // so viele Wohnräume hat der Katalog (Wohn-, Schlaf-, Arbeitszimmer, Flur)
// Je Bad 5 Aufgaben (WC, Waschbecken, Boden, Spiegel, Stöpsel). Der Katalog ist für 2 Bäder gebaut.
const PER_BATH = 5; // nur noch für die Grafik

const s = {
  flow: 'create', step: 0,
  names: ['', ''], colors: [0, 1], baths: 1,
  rooms: 4,
  features: Object.fromEntries(FEATURES.map(f => [f.id, f.on])),
  start: 'soft', voucher: '', cards: [], copied: false,
  off: new Set(), openArea: null,
};

const FLOWS = {
  create: ['welcome', 'names', 'home', 'plan', 'start', 'voucher', 'invite', 'done'],
  join: ['joinWelcome', 'joinWho', 'joinVoucher', 'done'],
};
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ms = n => `<span class="ms">${n}</span>`;
const nameA = () => s.names[0].trim() || 'Alex';
const nameB = () => s.names[1].trim() || 'Sam';
// Aufgabenliste für die gewählte Wohnung. Abgewählte (s.off) zählen nicht.
function planTasks() {
  const rooms = ROOM_NAMES.slice(0, s.rooms);
  const list = [];
  for (const [id, area, iv, points, name, tag] of CATALOG) {
    if (tag.startsWith('f:') && !s.features[tag.slice(2)]) continue;
    if (tag === 'bath2' && s.baths < 2) continue;
    if (tag.startsWith('room:') && !rooms.includes(tag.slice(5))) continue;
    list.push({ id, area, iv, points, name });
    if (tag === 'bath2' && s.baths >= 3) list.push({ id: id.replace(/-2$/, '-3'), area, iv, points, name: name.replace('Bad 2', 'Bad 3') });
  }
  rooms.forEach((room, i) => {
    const key = `room-${i}`;
    list.push({ id: `${key}-auf`, area: 'wohnen', iv: 'W', points: 5, name: `Aufräumen: ${room}` });
    list.push({ id: `${key}-staub`, area: 'wohnen', iv: 'W', points: 5, name: `Staubwischen: ${room}` });
    if (room !== 'Flur') list.push({ id: `${key}-fenster`, area: 'wohnen', iv: 'Q', points: 20, name: `Fenster putzen: ${room}` });
  });
  return list;
}
const taskCount = () => planTasks().filter(t => !s.off.has(t.id)).length;
  - FEATURES.filter(f => !s.features[f.id]).reduce((n, f) => n + f.tasks, 0);

// Fällig pro Tag in den ersten 14 Tagen. Heute: alles startet halb frisch, also alle
// Wochenaufgaben an Tag 4, 2-Wochen-Aufgaben an Tag 7. Sanft: über die Intervalle verteilt.
function dueByDay(mode) {
  const on = planTasks().filter(t => !s.off.has(t.id));
  const n = iv => on.filter(t => t.iv === iv).length;
  const weekly = n('W'), biweekly = n('2W'), monthly = n('M');
  const d = Array(14).fill(0);
  if (mode === 'now') { d[3] += weekly; d[6] += biweekly; return d; }
  for (let i = 0; i < weekly; i++) d[1 + (i % 6)]++;              // Tag 2 bis 7
  for (let i = 0; i < biweekly; i++) d[4 + (i % 2) * 5]++;        // Tag 5, 10
  for (let i = 0; i < monthly; i++) { const day = 7 + Math.floor(i * 23 / monthly); if (day < 14) d[day]++; }
  return d;
}

function chart(mode) {
  const d = dueByDay(mode), max = Math.max(...dueByDay('now'));
  return `<div class="chart">
    <div class="bars">${d.map((n, i) => `<i class="${n > 10 ? 'hot' : ''}" style="height:${Math.max(3, n / max * 100)}%">${n > 10 ? `<em>${n}</em>` : ''}</i>`).join('')}</div>
    <div class="axis">${d.map((_, i) => `<span>${i + 1}</span>`).join('')}</div>
    <div class="cap"><span>Erstmals fällig, Tag 1–14</span><span>${mode === 'now' ? `Tag 4: ${d[3]} auf einmal` : `höchstens ${Math.max(...d)} am Tag`}</span></div>
  </div>`;
}

// Überraschungstopf: drei Plätze, damit beim Ziehen eine echte Auswahl da ist. Eine Karte reicht zum Weitermachen.
const IDEAS = ['Frühstück ans Bett', 'Eine Massage, so lange du willst 😉', 'Du suchst den Film aus', 'Ein Abend ganz für uns zwei 😉', 'Ich übernehme deine nächste Aufgabe'];
function potScreen(forName, lead) {
  const n = s.cards.length;
  // Der nächste freie Platz ist selbst das Eingabefeld: dort schreibt man die eigene Idee.
  const slot = i => s.cards[i]
    ? `<div class="slot full"><span class="num">${i + 1}</span><span class="txt">${esc(s.cards[i])}</span>
        <button class="x" data-remove="${i}" aria-label="Entfernen">${ms('close')}</button></div>`
    : i === n
      ? `<div class="slot write"><span class="num">${i + 1}</span>
          <input id="voucher" value="${esc(s.voucher)}" placeholder="Schreib hier deine Idee …" maxlength="200" enterkeyhint="done">
          <button class="round sm" data-add ${s.voucher.trim() ? '' : 'disabled'} aria-label="In den Topf">${ms('add')}</button></div>`
      : `<div class="slot"><span class="num">${i + 1}</span><span class="txt">Noch frei</span></div>`;
  const extra = n >= 3 ? `<button class="more-card" data-more>${ms('add')}Noch eine Karte</button>` : '';
  const ideas = IDEAS.filter(t => !s.cards.includes(t)).slice(0, 3);
  return `
    <div class="hero partner"><div class="big-icon">${ms('redeem')}</div>
      <h1>Drei Überraschungen für ${esc(forName)}</h1>
      <p class="lead">${lead}</p></div>
    <div class="pot">
      <div class="pot-top"><b>Dein Topf für ${esc(forName)}</b><span class="${n >= 3 ? 'ok' : ''}">${Math.min(n, 3)} von 3${n > 3 ? ` · ${n} drin` : ''}</span></div>
      <div class="pips">${[0, 1, 2].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>
      ${Array.from({ length: Math.max(3, n + (s.writeMore ? 1 : 0)) }, (_, i) => slot(i)).join('')}
      ${s.writeMore || n < 3 ? '' : extra}
    </div>
    ${ideas.length && n < 3 ? `<div class="ideas"><span>Keine Idee? Antippen zum Übernehmen</span>${ideas.map(t => `<button class="chip" data-idea="${esc(t)}">${ms('add')}${esc(t)}</button>`).join('')}</div>` : ''}
    <div class="spacer"></div>
    <div class="foot"><button class="pill primary big" data-go="1" ${n ? '' : 'disabled'}>${n >= 3 ? `Fertig, ${n} Karten im Topf` : n ? `Weiter mit ${n === 1 ? 'einer Karte' : `${n} Karten`}` : 'Mindestens eine Karte hinlegen'}</button>
      ${n && n < 3 ? `<p class="fine">Noch ${3 - n} für eine echte Auswahl. Du kannst später jederzeit nachlegen.</p>` : ''}</div>`;
}

const screens = {
  welcome: () => `

      <div class="bullet">${ms('spa')}<span><b>Sanfter Start.</b> Die ersten zwei Wochen sind zum Reinkommen, ohne Minuspunkte.</span></div>

    ${[0, 1].map(i => `<div class="person">
      <label class="lbl" for="n${i}">${i ? 'Dein Partner' : 'Du'}</label>

    <div class="spacer"></div>

  home: () => {
    const toggle = (kind, x) => `<div class="row"><span class="tile" style="--ac:var(--area-${x.area ?? 'wohnen'})">${ms(x.icon)}</span>
        <span class="grow"><b>${x.name}</b><small>${x.hint}</small></span>
        <button class="switch${s[kind][x.id] ? ' on' : ''}" data-toggle="${kind}:${x.id}" role="switch" aria-checked="${s[kind][x.id]}"><span></span></button></div>`;
    return `
    <div class="hero"><h1>Was habt ihr zu Hause?</h1><p class="lead">Danach wählen wir die passenden Aufgaben aus. Der Flur zählt als Wohnraum, die Küche ist immer dabei. Räume könnt ihr später umbenennen, und alles lässt sich in den Einstellungen ändern.</p></div>

    <div class="card rows">
      <div class="row"><span class="tile" style="--ac:var(--area-bad)">${ms('bathtub')}</span>
        <span class="grow"><b>Badezimmer</b><small>${s.baths === 1 ? 'ein Bad' : `${s.baths} Bäder`}, auch Gäste-WC</small></span>
        <span class="stepper"><button data-count="baths:-1" ${s.baths <= 1 ? 'disabled' : ''}>${ms('remove')}</button><b>${s.baths}</b><button data-count="baths:1" ${s.baths >= 3 ? 'disabled' : ''}>${ms('add')}</button></span></div>
      <div class="row"><span class="tile" style="--ac:var(--area-wohnen)">${ms('weekend')}</span>
        <span class="grow"><b>Wohnräume</b><small>${ROOM_NAMES.slice(0, s.rooms).join(', ')}</small></span>
        <span class="stepper"><button data-count="rooms:-1" ${s.rooms <= 1 ? 'disabled' : ''}>${ms('remove')}</button><b>${s.rooms}</b><button data-count="rooms:1" ${s.rooms >= ROOM_NAMES.length ? 'disabled' : ''}>${ms('add')}</button></span></div>
    </div>
    <div class="sub">Ausstattung</div>
    <div class="card rows">${FEATURES.map(f => toggle('features', f)).join('')}</div>
    <div class="count"><b>${taskCount()}</b><span>Aufgaben in eurem Plan</span></div>
    <div class="foot"><button class="pill primary big" data-go="1">Weiter</button></div>`;
  },

  plan: () => {
    const tasks = planTasks();
    const on = tasks.filter(t => !s.off.has(t.id));
    const area = k => {
      const all = tasks.filter(t => t.area === k);
      if (!all.length) return '';
      const sel = all.filter(t => !s.off.has(t.id));
      const weekly = sel.filter(t => t.iv === 'W').length;
      const open = s.openArea === k;
      return `<div class="acc${open ? ' open' : ''}">
        <button class="row acc-head" data-area="${k}"><span class="tile" style="--ac:var(--area-${k})">${ms(AREAS[k].icon)}</span>
          <span class="grow"><b>${AREAS[k].name}</b><small>${sel.length} Aufgaben${weekly ? ` · ${weekly} wöchentlich` : ''}${sel.length < all.length ? ` · ${all.length - sel.length} abgewählt` : ''}</small></span>
          ${ms('expand_more')}</button>
        ${open ? `<div class="acc-body">${all.map(t => `<div class="trow${s.off.has(t.id) ? ' off' : ''}">
            <span class="grow"><b>${esc(t.name)}</b><small>${IV[t.iv]} · ${t.points} Punkte</small></span>
            <button class="switch sm${s.off.has(t.id) ? '' : ' on'}" data-task="${t.id}" role="switch" aria-checked="${!s.off.has(t.id)}"><span></span></button></div>`).join('')}</div>` : ''}
      </div>`;
    };
    return `
    <div class="hero"><h1>Euer Plan</h1><p class="lead">Das sind eure Aufgaben. Passt etwas nicht, klappt den Bereich auf und wählt es ab. Punkte und Abstände stellt ihr später in Ruhe ein.</p></div>
    <div class="count"><b>${on.length}</b><span>Aufgaben · ${on.filter(t => t.iv === 'W').length} davon wöchentlich</span></div>
    <div class="card rows">${Object.keys(AREAS).map(area).join('')}</div>
    <div class="foot"><button class="pill primary big" data-go="1">Passt so</button></div>`;
  },

  start: () => `
    <div class="hero"><h1>Wie wollt ihr starten?</h1><p class="lead">Sonst wird in der ersten Woche alles auf einmal fällig. Beim sanften Start verteilen sich die Aufgaben, und ihr lernt die App erst einmal kennen.</p></div>
    <button class="choice${s.start === 'soft' ? ' on' : ''}" data-start="soft"><span class="radio"></span><span class="grow">
      <span class="tag">Empfohlen</span><b>Sanfter Start</b>
      <small>Aufgaben werden nach und nach fällig, nicht alle am selben Tag. Die ersten <b>14 Tage gibt es keine Minuspunkte</b>, Punkte sammelt ihr trotzdem.</small></span></button>
    <button class="choice${s.start === 'now' ? ' on' : ''}" data-start="now"><span class="radio"></span><span class="grow">
      <b>Direkt loslegen</b><small>Alles läuft ab heute mit vollen Regeln. Für alle, die schon einen Putzplan gewohnt sind.</small></span></button>
    <div class="card">${chart(s.start)}</div>
    <div class="spacer"></div>
    <div class="foot"><button class="pill primary big" data-go="1">Weiter</button></div>`,

  voucher: () => potScreen(nameB(), `Kleine Gefallen, ein Abend nach Wunsch oder eine romantische Geste 😉 ${esc(nameB())} zieht beim Levelaufstieg verdeckt eine von drei Karten und sieht erst dann, was drinsteht.`),

  invite: () => `
    <div class="hero"><div class="big-icon">${ms('person_add')}</div><h1>Jetzt ${esc(nameB())} einladen</h1>
      <p class="lead">Schick ${esc(nameB())} den Link. Wer ihn öffnet, ist in eurem Haushalt und sieht denselben Plan.</p></div>
    <div class="card">
      <div class="code-box">7KQM-W4XT-RN8P-H2CV-Y9JE</div>
      <div class="btn2"><button class="pill" data-copy>${ms(s.copied ? 'check' : 'content_copy')}${s.copied ? 'Kopiert' : 'Code kopieren'}</button>
        <button class="pill primary">${ms('ios_share')}Link teilen</button></div>
    </div>
    <div class="note">${ms('key')}<span><b>Das ist euer Schlüssel.</b> Ohne Konto ist er der einzige Weg zurück in euren Haushalt, z. B. auf einem neuen Handy. Am besten einmal kopieren und in den Notizen ablegen. Ihr findet ihn auch später unter Einstellungen.</span></div>
    <div class="spacer"></div>
    <div class="foot"><button class="pill primary big" data-go="1">Plan starten</button>
      <button class="pill ghost" data-go="1">Später einladen</button></div>`,

  joinWelcome: () => `
    <div class="hero partner fade"><div class="big-icon">${ms('waving_hand')}</div>
      <h1>${esc(nameA())} hat euch einen Putzplan angelegt</h1>
      <p class="lead">Ihr seht denselben Plan und sammelt gemeinsam Punkte. ${s.start === 'soft' ? 'Die ersten zwei Wochen sind zum Reinkommen, ohne Minuspunkte.' : ''}</p></div>
    <div class="spacer"></div>
    <div class="foot"><button class="pill primary big" data-go="1">Mitmachen</button></div>`,

  joinWho: () => `
    <div class="hero"><h1>Wer bist du?</h1><p class="lead">Nur für dieses Handy. Name und Farbe kannst du gleich anpassen.</p></div>
    <div class="card rows">${[0, 1].map(i => `<div class="row"><span class="tile" style="--ac:var(--swatch-${s.colors[i] + 1})"><b style="color:var(--ac)">${esc((i ? nameB() : nameA())[0])}</b></span>
      <span class="grow"><b>${esc(i ? nameB() : nameA())}</b><small>${i ? 'Das bin ich' : 'hat den Haushalt angelegt'}</small></span>
      ${i ? ms('check_circle') : ''}</div>`).join('')}</div>
    <div class="spacer"></div>
    <div class="foot"><button class="pill primary big" data-go="1">Weiter als ${esc(nameB())}</button></div>`,

  joinVoucher: () => potScreen(nameA(), `${esc(nameA())} hat schon Karten für dich hinterlegt. Jetzt bist du dran: kleine Gefallen oder romantische Gesten 😉 ${esc(nameA())} zieht beim nächsten Levelaufstieg verdeckt eine davon.`),

  done: () => {
    const me = s.flow === 'join' ? nameB() : nameA();
    const soft = s.start === 'soft';
    return `
    <div class="hero fade"><h1>Hallo ${esc(me)}</h1></div>
    ${soft ? `<div class="banner fade"><span class="tile">${ms('spa')}</span><span class="grow"><b>Eingewöhnung · noch 14 Tage</b>
      <small>Keine Minuspunkte, Aufgaben werden nach und nach fällig. Punkte sammelt ihr ab sofort.</small>
      <div class="prog"><span style="width:4%"></span></div></span></div>` : ''}
    <div class="sec"><h3>Zu tun</h3><span>${soft ? 'ganz entspannt' : ''}</span></div>
    <div class="seg"><button>Überfällig</button><button class="on">Heute ${soft ? 2 : 0}</button><button>Woche ${soft ? 33 : 34}</button></div>
    <div class="list">${soft ? `
      <div class="frow"><span class="tile" style="--ac:var(--area-kueche)">${ms('skillet')}</span><span class="grow"><b>Spüle und Wasserhahn reinigen</b><small>heute fällig</small></span><span class="pts">+5</span></div>
      <div class="frow"><span class="tile" style="--ac:var(--area-wohnen)">${ms('weekend')}</span><span class="grow"><b>Aufräumen: Wohnzimmer</b><small>heute fällig</small></span><span class="pts">+5</span></div>`
      : '<p class="lead" style="padding:8px 4px">Heute ist nichts fällig. In 4 Tagen dann 34 Wochenaufgaben auf einmal.</p>'}</div>
    ${soft ? `<div class="note">${ms('lightbulb')}<span><b>Eine Aufgabe passt nicht zu euch?</b> Einfach antippen und ausblenden. In den ersten Tagen merkt ihr am besten, was ihr wirklich braucht.</span></div>` : ''}
    <div class="spacer"></div>
    <button class="pill" data-restart>${ms('replay')}Prototyp neu starten</button>`;
  },
};

function render() {
  const steps = FLOWS[s.flow];
  const key = steps[s.step];
  $('flow').innerHTML = [['create', 'Anlegen'], ['join', 'Beitreten (Partner)']]
    .map(([k, l]) => `<button class="${s.flow === k ? 'on' : ''}" data-flow="${k}">${l}</button>`).join('');
  const showTop = s.step > 0 && key !== 'done';
  $('app').innerHTML = `${showTop ? `<div class="top"><button class="back" data-go="-1" aria-label="Zurück">${ms('arrow_back')}</button>
      <div class="dots">${steps.slice(1, -1).map((_, i) => `<i class="${i < s.step ? 'on' : ''}"></i>`).join('')}</div>
      <span class="step-of">${s.step}/${steps.length - 2}</span></div>` : ''}
    ${screens[key]()}`;
  if (key !== render.last) scrollTo(0, 0);
  render.last = key;
}

let refocus = false; // nach dem Hinlegen gleich im nächsten Platz weiterschreiben
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.go) s.step = Math.max(0, Math.min(FLOWS[s.flow].length - 1, s.step + Number(d.go)));
  else if (d.flow) { s.flow = d.flow; s.step = 0; s.voucher = ''; s.cards = []; }
  else if (d.color) { const [i, c] = d.color.split(':').map(Number); s.colors[i] = c; }
  else if (d.count) { const [k, n] = d.count.split(':'); s[k] = Math.max(1, Math.min(k === 'baths' ? 3 : ROOM_NAMES.length, s[k] + Number(n))); }
  else if (d.area) s.openArea = s.openArea === d.area ? null : d.area;
  else if (d.task) { s.off.has(d.task) ? s.off.delete(d.task) : s.off.add(d.task); }
  else if (d.toggle) { const [k, id] = d.toggle.split(':'); s[k][id] = !s[k][id]; }
  else if (d.start) s.start = d.start;
  else if (d.idea) s.cards.push(d.idea);
  else if ('add' in d) { s.cards.push(s.voucher.trim()); s.voucher = ''; s.writeMore = false; refocus = true; }
  else if ('more' in d) { s.writeMore = true; refocus = true; }
  else if (d.remove) s.cards.splice(Number(d.remove), 1);
  else if ('copy' in d) { s.copied = true; setTimeout(() => { s.copied = false; render(); }, 1500); }
  else if ('restart' in d) { s.flow = 'create'; s.step = 0; s.voucher = ''; s.cards = []; }
  else return;
  render();
  if (refocus) { refocus = false; document.getElementById('voucher')?.focus(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.name) { s.names[el.dataset.name] = el.value; $('namesNext').disabled = !(s.names[0].trim() && s.names[1].trim()); }
  if (el.id === 'voucher') { s.voucher = el.value; document.querySelector('[data-add]').disabled = !el.value.trim(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'voucher' && e.key === 'Enter' && s.voucher.trim()) {
    s.cards.push(s.voucher.trim()); s.voucher = ''; s.writeMore = false; render(); document.getElementById('voucher')?.focus();
  }
});
render();
</script>
